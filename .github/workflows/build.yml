name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Set version from the run number
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          $f = "src-tauri/tauri.conf.json"
          (Get-Content $f -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$v`"" | Set-Content $f -NoNewline
          Select-String '"version"' $f
      - name: Bundle esptool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R espressif/esptool -p "*windows-amd64*.zip" -D esptool-dl
          Expand-Archive (Get-ChildItem esptool-dl/*.zip).FullName -DestinationPath esptool-dl/x
          $exe = Get-ChildItem esptool-dl/x -Recurse -Filter esptool.exe | Select-Object -First 1
          if (-not $exe) { throw "esptool.exe not found in the release archive" }
          Copy-Item "$($exe.Directory.FullName)\*" src-tauri/resources/esptool -Recurse -Force
          & "src-tauri/resources/esptool/esptool.exe" --help | Select-Object -First 3
      - name: Bundle avrdude
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R avrdudes/avrdude -p "*windows-x64*.zip" -D avrdude-dl
          Expand-Archive (Get-ChildItem avrdude-dl/*.zip).FullName -DestinationPath avrdude-dl/x
          $exe = Get-ChildItem avrdude-dl/x -Recurse -Filter avrdude.exe | Select-Object -First 1
          if (-not $exe) { throw "avrdude.exe not found in the release archive" }
          Copy-Item "$($exe.Directory.FullName)\*" src-tauri/resources/avrdude -Recurse -Force
          & "src-tauri/resources/avrdude/avrdude.exe" -? 2>&1 | Select-Object -First 2
      - run: cargo test -p esp_core
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: esp-terminal-windows
          path: target/release/bundle/nsis/*.exe
